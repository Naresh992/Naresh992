apiVersion: apps/v1
kind: Deployment
metadata:
  name: raritone-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raritone-worker
  template:
    metadata:
      labels:
        app: raritone-worker
    spec:
      containers:
        - name: worker
          image: raritone/backend:latest
          command: ["rq", "worker", "tryon"]
          envFrom:
            - secretRef:
                name: raritone-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
