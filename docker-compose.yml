version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: raritone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env.example
    depends_on: [db, redis]
    ports: ["8000:8000"]
